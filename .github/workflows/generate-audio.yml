name: Generate TOEFL audio
on:
  push:
    paths:
      - 'course.json'
      - 'scripts/generate_course_audio.py'
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS and audio tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate course audio
        run: python scripts/generate_course_audio.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/course.mp3 audio/course.meta.json audio/course.words.mp3 audio/course.sentences.mp3 audio/course.meanings.mp3
          git commit -m "Generate TOEFL course audio" || exit 0
          git push
