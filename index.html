<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TOEFL听力卡"><link rel="manifest" href="./manifest.webmanifest"><title>TOEFL 听力单词卡</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}main{max-width:760px;margin:auto;padding:20px 16px 40px}.hero{padding:12px 4px 18px}h1{margin:0 0 8px;font-size:28px}p{color:#667085;line-height:1.55}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;border:0;border-radius:12px;padding:12px;background:#e7ebf2}.tab.active{background:#111827;color:white}.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #0000000b}label{display:block;font-weight:700;margin:12px 0 8px}textarea,input,select{width:100%;border:1px solid #d8dee9;border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:190px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#111827;color:white}.btn.secondary{background:#e9edf3;color:#172033}.btn.good{background:#176b3a}.btn.bad{background:#8b2635}.hidden{display:none}.word{font-size:34px;font-weight:800;margin:8px 0}.meaning{color:#667085}.sentence{font-size:18px;line-height:1.65;background:#f7f8fa;border-radius:12px;padding:14px;margin:14px 0}.meta{font-size:13px;color:#667085}.list-item{padding:13px 0;border-bottom:1px solid #edf0f4}.list-item:last-child{border:0}.tip{background:#eef4ff;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;color:#344054}@media(max-width:520px){main{padding:14px 12px 30px}h1{font-size:24px}.word{font-size:30px}}</style></head><body><main><section class="hero"><h1>🎧 TOEFL 听力单词卡</h1><p>先粘贴完整听力原文，再输入没听出来的单词。系统会自动找到包含该词的完整句子，并支持美式英语朗读。</p></section><div class="tabs"><button class="tab active" data-tab="import">导入</button><button class="tab" data-tab="review">复习</button><button class="tab" data-tab="library">单词库</button></div><section id="import" class="panel"><div class="card"><label>① 完整 TOEFL 听力原文</label><textarea id="transcript" placeholder="把整篇听力 transcript 粘贴到这里……"></textarea><label>② 今天没听出来的单词</label><textarea id="words" placeholder="一个单词一行，例如：\nconsequence\nsubstantial | 大量的\ninterpret"></textarea><div class="row"><button class="btn" id="build">生成听力卡</button><button class="btn secondary" id="today">📚 加载今天早上的两篇</button></div><div class="tip">已为你保存今天截图里的两篇听力和黄色标记生词。点击“加载今天早上的两篇”，再点“生成听力卡”即可。</div></div><div id="preview"></div></section><section id="review" class="panel hidden"><div class="card"><div class="meta" id="progress">还没有复习卡</div><div class="word" id="rword">—</div><div class="meaning" id="rmeaning"></div><div class="sentence" id="rsentence">请先在“导入”中生成单词卡。</div><div class="row"><button class="btn" id="playWord">🔊 单词</button><button class="btn secondary" id="playSentence">▶️ 句子</button><button class="btn secondary" id="auto">⏯ 自动播放</button></div><label>朗读速度</label><select id="speed"><option value="0.65">0.65× 慢速</option><option value="0.8">0.8×</option><option value="1">1.0×</option><option value="1.1">1.1×</option></select><div class="row" style="margin-top:16px"><button class="btn bad" id="hard">没听出来</button><button class="btn good" id="easy">听懂了</button></div></div></section><section id="library" class="panel hidden"><div class="card"><div class="row"><button class="btn secondary" id="clear">清空单词库</button></div><div id="list"></div></div></section></main><script>const $=s=>document.querySelector(s);let cards=JSON.parse(localStorage.getItem('toeflCards')||'[]'),idx=0,auto=false;const TODAY_TRANSCRIPT=`Imagine an animal so well protected that even a hungry tiger walks away frustrated. Meet the Indian pangolin, a nocturnal mammal covered in overlapping scales that act like a suit of armor. These scales are made of keratin, the same protein found in human fingernails. They’re a powerful defense mechanism. When it encounters an enemy, the pangolin performs volvation, curling into a tight ball, providing itself with an impenetrable shield. This remarkable use of volvation makes pangolin exceptional among mammals. Few other creatures can achieve such a complete protective posture. Pangolins also have strong claws for digging and a long, sticky tongue that can extend to twenty-five centimeters, perfect for capturing ants and termites. They lack teeth, so instead of chewing, they grind their food in their stomach. Their stomach is lined with keratin plates, similar to their outer scales. These plates are extremely hard and work together with the contractions of the stomach to crush and grind captured prey. Now, although the Indian pangolin’s armor deters most predators, tigers, leopards, and hyenas occasionally manage to pry them open. Still, the greatest threat to the Indian pangolin is illegal hunting for scales and meat, which, along with habitat destruction, have pushed it toward endangered status. Why does this matter? Well, pangolins are ecological guardians. By consuming millions of insects, they prevent pest outbreaks that could harm crops and forests. Their digging also helps air get into the soil, improving plant health. Losing pangolins would disrupt these processes, creating ripple effects across various ecosystems.\n\nListen to a talk in a music history class. Imagine taking a regular piano and transforming its sound by inserting everyday objects like screws, bolts, and rubber erasers between the strings. This is what’s known as a prepared piano. It was developed by the avant-garde composer John Cage in 1940. Cage was working at a university in Seattle, and he needed to write music with percussion to accompany dancers, but the performance space’s stage wasn’t big enough for percussion instruments like drums, so he made the sounds with just the piano by placing objects between the strings. Now, Cage spent time searching for items that made the kind of sounds he was looking for. It had a feel of improvisation. Cage himself said that looking for items was kind of like walking on the beach and looking for shiny or beautiful seashells that you liked. That is, he didn’t know ahead of time what items he wanted to use. He just kept looking around and seeing what suited his needs. Cage ended up composing a collection of music for prepared piano in the mid-1940s. He included specific instructions for how to prepare the piano. For this collection, Cage was inspired by ancient Hindu theory and about eight essential emotions. He wanted his listeners to sense eight essential emotions from Hindu philosophy. The result is a blending of sounds that would be familiar to a western audience, plus sounds reminiscent of Indonesian gamelan. Um, gamelan is traditional Indonesian percussion music. This prepared piano music really raised John Cage’s profile in the music world.`;const TODAY_WORDS=`so well protected\nfrustrated\nnocturnal\noverlapping\narmor\nkeratin\nfingernails\nenemy\nvolvation\ncurling\nimpenetrable\nexceptional\ncreatures\ncomplete protective posture\nclaws\nsticky\nextend\ncapturing\nants and termites\nlack teeth\nchewing\ngrind\nis lined\ncontractions\ncrush and grind\nprey\narmor\ndeters\npredators\nleopards\nhyenas\noccasionally\nmanage to pry\nalong with\nhabitat destruction\nstatus\nmatter\nguardians\nconsuming\ninsects\npest outbreaks\ncrops and forests\ndisrupt\nripple effects\nregular\ninserting\nscrews, bolts, rubber erasers\navant-garde\npercussion\ndrums\nimprovisation\nseashells\nended up\nancient Hindu theory\nphilosophy\nwould be familiar to\nwestern audience\nreminiscent of\nIndonesian gamelan\nprofile`;const save=()=>localStorage.setItem('toeflCards',JSON.stringify(cards));function sentenceOf(text,w){const esc=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const parts=text.split(/(?<=[.!?])\s+/);const m=parts.find(s=>new RegExp('\\b'+esc+'\\b','i').test(s)||s.toLowerCase().includes(w.toLowerCase()));return m?m.trim():''}function build(){const t=$('#transcript').value.trim();const lines=$('#words').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!t||!lines.length)return alert('请先填写完整听力原文和至少一个单词。');cards=lines.map(x=>{let [word,...rest]=x.split('|');word=word.trim();return{word,meaning:rest.join('|').trim(),sentence:sentenceOf(t,word),ok:0}});idx=0;save();renderPreview();renderReview();renderList()}function speak(text){if(!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=+$('#speed').value;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}function renderPreview(){$('#preview').innerHTML=cards.map(c=>`<div class="card"><b>${escape(c.word)}</b>${c.meaning?` <span class="meaning">— ${escape(c.meaning)}</span>`:''}<div class="sentence">${c.sentence?escape(c.sentence):'⚠️ 没在原文中找到完整句子，请检查单词拼写或 transcript。'}</div><button class="btn secondary" onclick="speak(${JSON.stringify(c.word)})">🔊 听单词</button> <button class="btn secondary" onclick="speak(${JSON.stringify(c.sentence||c.word)})">▶️ 听句子</button></div>`).join('')}function renderReview(){if(!cards.length){$('#progress').textContent='还没有复习卡';$('#rword').textContent='—';$('#rsentence').textContent='请先在“导入”中生成单词卡。';return}const c=cards[idx];$('#progress').textContent=`第 ${idx+1} / ${cards.length}`;$('#rword').textContent=c.word;$('#rmeaning').textContent=c.meaning||'（可在导入时填写中文释义）';$('#rsentence').textContent=c.sentence||'没有找到对应句子。'}function renderList(){$('#list').innerHTML=cards.length?cards.map(c=>`<div class="list-item"><b>${escape(c.word)}</b><div class="meta">${c.meaning||'无释义'} · ${c.sentence?'已找到原句':'未找到原句'}</div></div>`).join(''):'<p>单词库为空。</p>'}function escape(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function grade(ok){if(!cards.length)return;cards[idx].ok=ok?1:0;if(ok){idx=(idx+1)%cards.length}else{idx=(idx+2)%cards.length}save();renderReview();if(auto)setTimeout(()=>speak(cards[idx].sentence||cards[idx].word),400)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='review')renderReview();if(b.dataset.tab==='library')renderList()});$('#build').onclick=build;$('#today').onclick=()=>{$('#transcript').value=TODAY_TRANSCRIPT;$('#words').value=TODAY_WORDS;window.scrollTo({top:0,behavior:'smooth'})};$('#playWord').onclick=()=>speak(cards[idx]?.word||'');$('#playSentence').onclick=()=>speak(cards[idx]?.sentence||cards[idx]?.word||'');$('#hard').onclick=()=>grade(false);$('#easy').onclick=()=>grade(true);$('#auto').onclick=()=>{auto=!auto;$('#auto').textContent=auto?'⏸ 停止自动播放':'⏯ 自动播放';if(auto&&cards.length)speak(cards[idx].sentence||cards[idx].word)};$('#clear').onclick=()=>{if(confirm('确定清空全部单词吗？')){cards=[];save();renderReview();renderList()}};if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');renderReview();renderList();</script></body></html>
